name: Publish Stage (SNAPSHOT)

on:
  pull_request:
    branches:
      - stage
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate SNAPSHOT & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate SNAPSHOT Version for Stage
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current project version: $VERSION"
          if [[ "$VERSION" != *"SNAPSHOT"* ]]; then
            echo "::error::Stage branch requires a SNAPSHOT version in pom.xml (e.g. X.Y.Z-SNAPSHOT), but found '$VERSION'. Rejection enforced."
            exit 1
          fi
          echo "Version '$VERSION' is a valid SNAPSHOT."

      - name: Run Tests
        run: mvn -B clean test -ntp

  publish-stage:
    name: Publish SNAPSHOT to GitHub Packages
    needs: validate-and-test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/stage')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy SNAPSHOT Package
        run: mvn -B clean deploy -DskipTests -ntp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

